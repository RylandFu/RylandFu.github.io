        summary: 
        highlights:
          - Built a synthetic-data generation pipeline combining SUMO traffic simulation with Blender rendering:SUMO-generated traffic flows were imported into Blender with pre-built 3D vehicle and scene assets, then rendered into RGBA image sequences via a virtual camera to produce realistic training data.
          - Optimised the rendering pipeline from full PBR to unlit shading, cutting per-frame render time from 20s to 1s — shifting the workflow from offline batch data collection to real-time, on-the-fly training data generation.
          - Integrated imgaug-based augmentation into the rendering output to add weather (fog, snow) and camera-artefact variation, improving the diversity and robustness of the training data.
          - •Researched reinforcement-learning approaches for adaptive algorithm selection within traffic-simulation scenarios.

      - company: INF Technology (Shanghai) Co., Ltd.
